<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Michigan Team-1</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
  <script>
    var isIE11 = !!window.MSInputMethodContext && !!document.documentMode;
    if (isIE11) {
      alert("Microsoft Internet Explorer is an unsupported browser.  Please use Edge/Chrome/etc.");
    }
  </script>
  <style>

    .loaderTable {
      width: 100%;
      height: 100%;
      top: 0px;
      left: 0px;
      position: fixed;
      opacity: .9;
      background-color: #fff;
      z-index: 10000;
    }

      .loaderTable tr td {
        opacity: 1;
        vertical-align: middle;
      }

        .loaderTable tr td:first-child {
          text-align: right;
        }

        .loaderTable tr td:last-child {
          padding-left: 4px;
          text-align: left;
        }
  </style>
</head>
<body>
  <table class="loaderTable">
    <tr>
      <td><i class="fas fa-spinner fa-5x fa-pulse"></i></td>
      <td><strong>Loading...</strong></td>
    </tr>
  </table>
  <app></app>
</body>
</html>
