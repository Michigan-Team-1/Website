<div>
  <div [cgBusy]="isBusy">
    <div class="form-group">
      <select id="country" class="form-control" [(ngModel)]="addressObj.country" [required]="isRequired" (onchange)="countryChanged"
              [compareWith]="countryCompareWith" name="country{{nameSuffix}}" #country="ngModel">
        <option [ngValue]="undefined">Select Country...</option>
        <option *ngFor="let o of countries" [ngValue]="o">{{o.name}}</option>
      </select>
      <div *ngIf="f != null && f.submitted && country.invalid && (country.dirty || country.touched || f.submitted)" class="invalid-feedback d-block">
        <div *ngIf="country.errors.required">
          {{dtoPropertyAttributes.country_Attributes | requiredErrorMessage}}
        </div>
      </div>
    </div>
    <div class="form-group">
      <input type="text" name="address1{{nameSuffix}}" [(ngModel)]="addressObj.address1" class="form-control" [placeholder]="dtoPropertyAttributes.address1_Attributes.name"
             [required]="isRequired" #address1="ngModel"
             [attr.maxlength]="dtoPropertyAttributes.address1_Attributes.stringLength.maxLength" />
      <div *ngIf="f != null && f.submitted && address1.invalid && (address1.dirty || address1.touched || f.submitted)" class="invalid-feedback d-block">
        <div *ngIf="address1.errors.required">
          {{dtoPropertyAttributes.address1_Attributes | requiredErrorMessage}}
        </div>
      </div>
      <input type="text" name="address2{{nameSuffix}}" [(ngModel)]="addressObj.address2" class="form-control mt-2" [placeholder]="dtoPropertyAttributes.address2_Attributes.name"
             [attr.maxlength]="dtoPropertyAttributes.address2_Attributes.stringLength.maxLength" />
      <input *ngIf="addressObj != null && addressObj.country != null && !addressObj.country.governingDistrictName" type="text" name="address3{{nameSuffix}}" [(ngModel)]="addressObj.address3" class="form-control mt-2"
             [placeholder]="dtoPropertyAttributes.address3_Attributes.name" [attr.maxlength]="dtoPropertyAttributes.address3_Attributes.stringLength.maxLength" />
    </div>
    <div class="form-group">
      <input type="text" name="city{{nameSuffix}}" [(ngModel)]="addressObj.city" class="form-control mt-2" [placeholder]="dtoPropertyAttributes.city_Attributes.name" [required]="isRequired" #city="ngModel"
             [attr.maxlength]="dtoPropertyAttributes.city_Attributes.stringLength.maxLength" />
      <div *ngIf="f != null && f.submitted && city.invalid && (city.dirty || city.touched || f.submitted)" class="invalid-feedback d-block">
        <div *ngIf="city.errors.required">
          City is required
        </div>
      </div>
    </div>
    <div class="form-group form-row">
      <div class="col-sm-6" *ngIf="addressObj != null && addressObj.country != null && addressObj.country.governingDistrictName">
        <select id="governingDistrict"
                class="form-control" [(ngModel)]="addressObj.governingDistrictId"
                [required]="isRequired && addressObj.country.governingDistrictName" name="governingDistrict{{nameSuffix}}" #governingDistrict="ngModel">
          <option [ngValue]="undefined">{{addressObj.country.governingDistrictName}}...</option>
          <option *ngFor="let o of governingDistricts | governingDistrictsByCountry:addressObj.country.countryId" [ngValue]="o.governingDistrictId">{{o.name}}</option>
        </select>
        <div *ngIf="f != null && f.submitted && governingDistrict.invalid && (governingDistrict.dirty || governingDistrict.touched || f.submitted)" class="invalid-feedback d-block">
          <div *ngIf="governingDistrict.errors.required">
            {{addressObj.country.governingDistrictName}} is required.
          </div>
        </div>
      </div>
      <div class="col-sm-6" *ngIf="addressObj != null && addressObj.country != null && addressObj.country.postalCodeMask">
        <input type="text" name="postalCode{{nameSuffix}}" [(ngModel)]="addressObj.postalCode"
               class="form-control" [placeholder]="dtoPropertyAttributes.postalCode_Attributes.name" [required]="isRequired && addressObj.country.postalCodeMask"
               #postalCode="ngModel" [inputMask]="addressObj.country.postalCodeMask"
               [attr.maxlength]="dtoPropertyAttributes.postalCode_Attributes.stringLength.maxLength" />
        <div *ngIf="f != null && f.submitted && postalCode.invalid && (postalCode.dirty || postalCode.touched || f.submitted)" class="invalid-feedback d-block">
          <div *ngIf="postalCode.errors.required">
            Postal code is required.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
