  <button type="submit" class="btn btn-primary mr-2" [disabled]="(f != null && f.form.invalid && f.submitted)" (click)="onSave()" accesskey="S"><i class="far fa-save"></i> Save</button>
  <button type="button" class="btn btn-outline-warning" (click)="onClose('Close click')" accesskey="C"><i class="fas fa-window-close"></i> Cancel</button>
