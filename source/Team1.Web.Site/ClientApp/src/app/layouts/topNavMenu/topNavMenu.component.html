<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark position-absolute-md topNav">
  <div class="d-flex w-100">
    <div><a class="navbar-brand" [routerLink]="['/dashboard']"><img [src]="logo" alt="logo" class="img-fluid" /></a></div>
    <!--when using side-nav menu, following <div> must have the CSS class "justify-content-end" added, remove the CSS class for top-nav-->
    <div class="flex-grow-1">
      <div class="d-flex text-center align-self-start">
        <div class="flex-grow-1"><h1 class="text-light">Michigan Team 1</h1></div>
        <div class="text-right">
          <button class="navbar-toggler" [attr.aria-expanded]="isBurgerMenuExpanded" aria-controls="navbarCollapse" aria-label="Toggle navigation" type="button"
                  (click)="isBurgerMenuExpanded = !isBurgerMenuExpanded">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </div>
      <div class="d-flex">
        <div class="collapse navbar-collapse navbarCollapse" [collapse]="!isBurgerMenuExpanded">
          <!--when using side-nav menu, following <ul> must have the CSS class "topNav-hide-md" added, remove the CSS class for top-nav-->
          <ul class="navbar-nav mr-auto" navLinks></ul>
          <ul class="navbar-nav" *ngIf="isImpersonating">
            <li>
              <span class="badge badge-danger">Impersonating:  {{ impersonatingWhom }}</span>
              <button type="button" class="btn btn-default btn-xs" title="To Your Identity" (click)="endImpersonation()">
                <i class="fa fa-user-secret"></i>
              </button>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li *ngIf="isAuthenticated" class="nav-item dropdown" dropdown>
              <a class="nav-link dropdown-toggle canSelect" id="profileLink" aria-haspopup="true" dropdownToggle
                 aria-expanded="false">{{userInfo.email}}</a>
              <div class="dropdown-menu dropdown-menu-right" aria-labelledby="profileLink" *dropdownMenu>
                <a class="dropdown-item" [routerLinkActive]="['active']" [routerLink]="['/profile']"><i class="fas fa-user fa-fw"></i> Profile</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item canSelect" (click)="logout()"><i class="fas fa-sign-out-alt fa-fw"></i> Logout</a>
              </div>
            </li>
            <li *ngIf="!isAuthenticated" class="nav-item" [routerLinkActive]="['active']">
              <a class="nav-link" [routerLink]="['/register']"><i class="fas fa-user-plus fa-fw"></i> Register</a>
            </li>
            <li *ngIf="!isAuthenticated" class="nav-item" [routerLinkActive]="['active']">
              <a class="nav-link" [routerLink]="['/login']"><i class="fas fa-sign-in-alt fa-fw"></i> Login</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
