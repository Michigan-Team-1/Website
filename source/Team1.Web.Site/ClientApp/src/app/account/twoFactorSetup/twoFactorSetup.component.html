<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <div class="text-center"><img [src]="logo" alt="Logo" class="img-fluid" /></div>
      <h4>Two Factor Setup</h4>
      <p>Please enter a phone number that can receive SMS messages.</p>
      <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
      <form [cgBusy]="isBusy" name="form" (ngSubmit)="f.form.valid && submit()" [class.form-submitted]="f.submitted" #f="ngForm" novalidate>
        <div class="form-group">
          <label class="control-label" for="phoneNumber"><defaultLabel [propertyAttributes]="dtoPropertyAttributes.phoneNumber_Attributes"></defaultLabel></label>
          <input type="text" class="form-control form-control-lg" id="phoneNumber" name="phoneNumber" [(ngModel)]="dto.phoneNumber" #phoneNumber="ngModel" [autofocus]="true"
                 [required]="dtoPropertyAttributes.phoneNumber_Attributes.required.value" placeholder="Enter a SMS capable Phone Number" inputMaskPhone />
          <div *ngIf="f.submitted && phoneNumber.invalid && (phoneNumber.dirty || phoneNumber.touched || f.submitted)" class="invalid-feedback d-block">
            <div *ngIf="phoneNumber.errors.required">
              {{dtoPropertyAttributes.phoneNumber_Attributes | requiredErrorMessage}}
            </div>
          </div>
        </div>
        <div class="form-group text-right">
          <button [disabled]="f.form.invalid && f.submitted" class="btn btn-primary" accesskey="S"><i class="far fa-save"></i> Submit</button>&nbsp;
          <a [routerLink]="['/login']" class="btn btn-warning" accesskey="C"><i class="fas fa-times"></i> Cancel</a>
        </div>
      </form>
      <twoFactorApps></twoFactorApps>
    </div>
  </div>
</div>
