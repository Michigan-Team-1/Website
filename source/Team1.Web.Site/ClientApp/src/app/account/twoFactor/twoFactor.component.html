<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <div class="text-center"><img [src]="logo" alt="Logo" class="img-fluid" /></div>
      <h4>Two Factor Authentication</h4>
      <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
      <form [cgBusy]="isBusy" name="form" (ngSubmit)="f.form.valid && submit()" [class.form-submitted]="f.submitted" #f="ngForm" novalidate>
        <div class="form-group">
          <label class="control-label" for="twoFactorCode"><defaultLabel [propertyAttributes]="dtoPropertyAttributes.twoFactorCode_Attributes"></defaultLabel></label>
          <input type="text" class="form-control form-control-lg" id="twoFactorCode" name="twoFactorCode" [(ngModel)]="dto.twoFactorCode" #twoFactorCode="ngModel"
                 [required]="dtoPropertyAttributes.twoFactorCode_Attributes.required.value" placeholder="Enter Your Code" [autofocus]="true"/>
          <div *ngIf="f.submitted && twoFactorCode.invalid && (twoFactorCode.dirty || twoFactorCode.touched || f.submitted)" class="invalid-feedback d-block">
            <div *ngIf="twoFactorCode.errors.required">
              {{dtoPropertyAttributes.twoFactorCode_Attributes | requiredErrorMessage}}
            </div>
          </div>
        </div>
        <div class="form-check">
          <label class="form-check-label">
            <input type="checkbox" class="form-check-input" [(ngModel)]="dto.rememberBrowser" name="rememberBrowser">
            {{dtoPropertyAttributes.rememberBrowser_Attributes.name}}
          </label>
        </div>
        <div class="form-group text-right">
          <button [disabled]="f.form.invalid && f.submitted" class="btn btn-primary" accesskey="S"><i class="far fa-save"></i> Submit</button>&nbsp;
          <a [routerLink]="['/login']" class="btn btn-warning" accesskey="C"><i class="fas fa-times"></i> Cancel</a>
        </div>
      </form>
      <twoFactorApps></twoFactorApps>
    </div>
  </div>
</div>
