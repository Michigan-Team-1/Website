<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <div class="text-center"><img [src]="logo" alt="Logo" class="img-fluid logo-big" /></div>
      <h4>Forgot Password</h4>
      <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
      <form [cgBusy]="isBusy" name="form" (ngSubmit)="f.form.valid && submit()" [class.form-submitted]="f.submitted" #f="ngForm" novalidate>
        <div class="form-group">
          <label class="control-label" for="email"><defaultLabel [propertyAttributes]="dtoPropertyAttributes.email_Attributes"></defaultLabel></label>
          <div class="input-group input-group-lg">
            <div class="input-group-prepend">
              <span class="input-group-text">
                <i class="fas fa-user"></i>
              </span>
            </div>
            <input type="email" class="form-control form-control-lg" id="email" name="email" [(ngModel)]="dto.email" #email="ngModel" email autocomplete="off"
                   [required]="dtoPropertyAttributes.email_Attributes.required.value" placeholder="Enter Your Email" [autofocus]="true"/>
          </div>
          <div *ngIf="email.invalid && (email.dirty || email.touched || f.submitted)" class="invalid-feedback d-block">
            <div *ngIf="f.submitted && email.errors.required">
              {{dtoPropertyAttributes.email_Attributes | requiredErrorMessage}}
            </div>
            <div *ngIf="email.errors.email">
              {{dtoPropertyAttributes.email_Attributes.emailAddress.errorMessage}}
            </div>
          </div>
        </div>
        <div class="form-group text-right">
          <button [disabled]="f.form.invalid && f.submitted" class="btn btn-primary" accesskey="S"><i class="far fa-save"></i> Send Reset Link</button>&nbsp;&nbsp;
          <a [routerLink]="['/login']" class="btn btn-warning" accesskey="C"><i class="fas fa-times"></i> Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
