<div class="container jumbotron">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-8">
      <div class="text-center"><img [src]="logo" alt="Logo" class="img-fluid" /></div>
      <h4>Confirm Email</h4>
      <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
      <form [cgBusy]="isBusy" name="form" (ngSubmit)="f.form.valid" [class.form-submitted]="f.submitted" #f="ngForm" novalidate>
        <div class="form-group" *ngIf="message == null">
          Thank you for confirming your email.
        </div>
        <div class="form-group text-right">
          <a [routerLink]="['/login']" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
