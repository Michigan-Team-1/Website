<div class="modal-header">
  <h4 class="modal-title">Announcement Add/Edit</h4>
  <div class="col-sm">
    <unsavedChangesNotification [dataUpdated]="dataUpdated"></unsavedChangesNotification>
  </div>
  <button type="button" class="close text-white" aria-label="Close" (click)="close('Cross click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<form [cgBusy]="isBusy" name="form" (ngSubmit)="f.form.valid && save(f)" [class.form-submitted]="f.submitted" #f="ngForm" novalidate>
  <div class="modal-body">
    <div *ngIf="f.submitted && !f.form.valid" class="alert alert-danger"><h4>Check for invalid fields</h4></div>
    <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
    <spudStringMax [propertyAttributes]="dtoPropertyAttributes.title_Attributes" [dto]="dto" [predicate]="'title'" [dtoOriginal]="dtoOriginal" [form]="f">
    </spudStringMax>
    <div class="form-group form-row">
      <label for="body" class="col-form-label col-sm-3"><defaultLabel [propertyAttributes]="dtoPropertyAttributes.body_Attributes"></defaultLabel></label>
      <div class="col-sm-9">
        <editor id="body" name="body" apiKey="qt9cl0arv9npsi7b9070ahey4jwcymvh44c9jtzkc3gltsiy" [(ngModel)]="dto.body"
                [init]="{height: 700, plugins: ['advlist autolink lists link charmap anchor', 'searchreplace visualblocks code fullscreen',
       'insertdatetime table paste code help wordcount'], toolbar: 'undo redo | formatselect | bold italic backcolor | \
       alignleft aligncenter alignright alignjustify | \
       bullist numlist outdent indent | removeformat | help' }" #body="ngModel"></editor>
        <div *ngIf="f.submitted && body.invalid && (body.dirty || body.touched || f.submitted)" class="invalid-feedback d-block">
          <div *ngIf="body.errors.required">
            {{dtoPropertyAttributes.body_Attributes | requiredErrorMessage}}
          </div>
        </div>
      </div>
    </div>
    <inputDate [propertyAttributes]="dtoPropertyAttributes.startShowingOnDate_Attributes" [dto]="dto" [predicate]="'startShowingOnDate'" [dtoOriginal]="dtoOriginal" [form]="f">
    </inputDate>
    <spudCheckbox [propertyAttributes]="dtoPropertyAttributes.isActive_Attributes" [dto]="dto" [predicate]="'isActive'" [dtoOriginal]="dtoOriginal" [form]="f"></spudCheckbox>
    <div *ngIf="f.submitted && !f.form.valid" class="alert alert-danger"><h4>Check for invalid fields</h4></div>
    <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
  </div>
  <div class="modal-footer">
    <unsavedChangesNotification [dataUpdated]="dataUpdated"></unsavedChangesNotification>
    <button type="submit" class="btn btn-primary mr-2" [disabled]="(f != null && f.form.invalid && f.submitted)" (click)="keepModalOpen = true" accesskey="S"><i class="far fa-save"></i> Save &amp; Stay</button>
    <modalDefaultFooterButtons [form]="f" (close)="close($event)"></modalDefaultFooterButtons>
  </div>
</form>
