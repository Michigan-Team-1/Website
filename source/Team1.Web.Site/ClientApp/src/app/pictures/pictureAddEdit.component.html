<div class="modal-header">
  <h4 class="modal-title">Picture Add/Edit</h4>
  <div class="col-sm">
    <unsavedChangesNotification [dataUpdated]="dataUpdated"></unsavedChangesNotification>
  </div>
  <button type="button" class="close text-white" aria-label="Close" (click)="close('Cross click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<form [cgBusy]="isBusy" name="form" (ngSubmit)="f.form.valid && save(f)" [class.form-submitted]="f.submitted" #f="ngForm" novalidate>
  <div class="modal-body">
    <div *ngIf="f.submitted && !f.form.valid" class="alert alert-danger"><h4>Check for invalid fields</h4></div>
    <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
    <div class="form-group form-row">
      <label for="fileUpload" class="col-form-label col-sm-3"><defaultLabel [propertyAttributes]="dtoPropertyAttributes.document_Attributes"></defaultLabel></label>
      <div class="col-sm-9">
        <input #fileInput type="file" class="form-control-file" id="fileUpload" (change)="handleFileInput($event.target.files)">
      </div>
    </div>
    <div class="form-group text-center ">
      <img *ngIf="newSrc" [src]="newSrc" alt="Picture" class="img-fluid image-limiter" />
    </div>
    <div class="form-group text-center">
      <img *ngIf="dto!.pictureId! > 0" [src]="pictureUrlFunction(dto!.pictureId!) | secureImage | async" alt="Picture" class="img-fluid image-limiter" />
    </div>
    <textAreaMax [propertyAttributes]="dtoPropertyAttributes.description_Attributes" [dto]="dto" [predicate]="'description'" [dtoOriginal]="dtoOriginal" [form]="f"></textAreaMax>
    <spudCheckbox *ngIf="authService.canApprovePicture" [propertyAttributes]="dtoPropertyAttributes.isApproved_Attributes" [dto]="dto" [predicate]="'isApproved'" [dtoOriginal]="dtoOriginal" [form]="f"></spudCheckbox>
    <spudCheckbox [propertyAttributes]="dtoPropertyAttributes.isActive_Attributes" [dto]="dto" [predicate]="'isActive'" [dtoOriginal]="dtoOriginal" [form]="f"></spudCheckbox>
    <div *ngIf="f.submitted && !f.form.valid" class="alert alert-danger"><h4>Check for invalid fields</h4></div>
    <div *ngIf="message != null" class="alert alert-danger"><h4 [innerHTML]="message"></h4></div>
  </div>
  <div class="modal-footer">
    <unsavedChangesNotification [dataUpdated]="dataUpdated"></unsavedChangesNotification>
    <modalDefaultFooterButtons [form]="f" (close)="close($event)"></modalDefaultFooterButtons>
  </div>
</form>
